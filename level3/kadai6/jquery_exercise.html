<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>jQuery練習</title>
    <style>
        .box { width: 100px; height: 100px; background-color: lightblue; margin: 10px; cursor: pointer; }
        .accordion-content { display: none; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>jQuery練習</h1>
    <button id="alert-button">クリックしてね</button>
    <div class="box">ホバーしてね</div>

    <h3 class="accordion-title">アコーディオンメニュー（クリックで開閉）</h3>
    <div class="accordion-content">
        <p>
            これはアコーディオンの中身です。クリックで表示/非表示が切り替わります。
        </p>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
