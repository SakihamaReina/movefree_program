<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>jQueryアニメーション演習</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .popup-trigger { padding: 10px 20px; background-color: #3498db; color: white; border: none; cursor: pointer; }
        .popup-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            display: none; 
        }
        .popup-content {
            background-color: white; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .close-popup { margin-top: 20px; padding: 8px 15px; background-color: #e74c3c; color: white; border: none; cursor: pointer; }

        .slide-section-title { background-color: #2ecc71; color: white; padding: 15px; margin-top: 20px; cursor: pointer; }
        .slide-section-content { background-color: #ecf0f1; padding: 15px; border: 1px solid #ccc; display: none; }
        
        .custom-animation-box {
            width: 100px; height: 100px; background-color: #f39c12; margin-top: 20px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>jQuery アニメーション演習</h1>

    <h2>1. フェードイン・フェードアウト ポップアップ</h2>
    <button class="popup-trigger">ポップアップを開く</button>
    <div class="popup-modal">
        <div class="popup-content">
            <h3>ようこそ！</h3>
            <p>これはjQueryで表示されるポップアップです。</p>
            <button class="close-popup">閉じる</button>
        </div>
    </div>

    <h2>2. スライド効果のアコーディオン</h2>
    <div class="slide-section-title">クリックで詳細を表示/非表示</div>
    <div class="slide-section-content">
        <p>ここに詳細情報が入ります。</p>
        <p>スライド効果でスムーズに開閉します。</p>
    </div>

    <h2>3. カスタムアニメーション</h2>
    <div class="custom-animation-box">クリックしてアニメーション</div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
