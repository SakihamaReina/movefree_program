<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>jQuery CSS操作演習</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .box {
            width: 150px; height: 150px; background-color: lightblue;
            border: 2px solid blue; margin: 20px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white;
            transition: all 0.3s ease;
        }
        .controls button { padding: 10px 15px; margin: 5px; cursor: pointer; }

        .box.highlight {
            background-color: lightcoral;
            border-color: red;
            transform: scale(1.1);
        }
        .box.round {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>jQuery CSS操作演習</h1>

    <h2>1. CSSプロパティの動的な変更</h2>
    <div id="dynamic-box" class="box">ここにテキスト</div>
    <div class="controls">
        <button id="change-color-size">色とサイズを変更</button>
        <button id="reset-style">リセット</button>
    </div>

    <h2>2. CSSクラスの付け外し</h2>
    <div id="class-box" class="box">クラスを付け外し</div>
    <div class="controls">
        <button id="toggle-highlight">ハイライトを切り替え</button>
        <button id="toggle-round">丸い形を切り替え</button>
    </div>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
